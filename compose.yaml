name: minierp

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" > /dev/null'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -Eeuo pipefail
        sqlcmd=(/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -I -b -V 11 -l 30 -f 65001)
        for script in /database/SQLServer/01_init_data.sql /database/SQLServer/02_insert_data.sql; do
          test -f "$$script" || { echo "Missing SQL file: $$script" >&2; exit 1; }
        done
        "$${sqlcmd[@]}" -d master -Q "IF DB_ID(N'TestingSystem') IS NULL CREATE DATABASE [TestingSystem];"
        initialized=$$("$${sqlcmd[@]}" -d TestingSystem -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN OBJECT_ID(N'dbo.__DockerInitialization', N'U') IS NULL THEN 0 ELSE 1 END;")
        if [[ "$${initialized//[[:space:]]/}" == "1" ]]; then
          echo "TestingSystem has already been initialized; skipping schema and seed."
          exit 0
        fi
        cat > /tmp/initialize.sql <<'SQL'
        USE [TestingSystem];
        GO
        SET XACT_ABORT ON;
        BEGIN TRANSACTION;
        GO
        :r /database/SQLServer/01_init_data.sql
        :r /database/SQLServer/02_insert_data.sql
        CREATE TABLE dbo.__DockerInitialization (
          InitializedAt DATETIME2(3) NOT NULL DEFAULT SYSUTCDATETIME()
        );
        INSERT INTO dbo.__DockerInitialization DEFAULT VALUES;
        COMMIT TRANSACTION;
        GO
        SQL
        echo "Initializing TestingSystem schema and sample data..."
        "$${sqlcmd[@]}" -d TestingSystem -i /tmp/initialize.sql
        echo "TestingSystem initialization completed."
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./database:/database:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

volumes:
  sqlserver-data:
